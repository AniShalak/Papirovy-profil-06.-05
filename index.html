<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papírový profil</title>
  <script>
    var isMobile = window.innerWidth <= 768 || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    var base = window.location.href.replace(/index\.html$/, '').replace(/\/$/, '/');
    window.location.replace(isMobile ? base + 'mobile.html' : base + 'desktop.html');
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0;url=desktop.html">
  </noscript>
</head>
<body></body>
</html>
